baseURL = "https://ryabinin.pro/"
theme = "PaperMod"
defaultContentLanguage = "ru"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[minify]
  disableXML = true

[params]
  env = "production"
  DateFormat = "January 2006"
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowShareButtons = false
  ShowReadingTime = false
  ShowBreadCrumbs = false
  ShowPostNavLinks = false
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = false
  UseHugoToc = true
  disableSpecial1stPost = true
  hidemeta = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[languages]

  [languages.ru]
    languageName = "Русский"
    languageCode = "ru"
    weight = 1
    title = "Андрей Рябинин — Портфолио"
    contentDir = "content/ru"

    [languages.ru.params]
      title = "Андрей Рябинин"
      description = "Портфолио системного администратора — проекты, навыки, контакты"
      keywords = ["портфолио", "разработчик", "проекты"]
      author = "Андрей Рябинин"
      mainSections = ["projects"]

      [languages.ru.params.homeInfoParams]
        Title = "Привет, я Андрей 👋"
        Content = """
Системный администратор. Поддерживаю IT-инфраструктуру, отвечаю за серверы, сети и бесперебойную работу сервисов.
Ниже — немного обо мне и подборка кейсов, которые стоит посмотреть.
"""

      [[languages.ru.params.socialIcons]]
        name = "github"
        url = "https://github.com/xrumdik"

      [[languages.ru.params.socialIcons]]
        name = "linkedin"
        url = "https://www.linkedin.com/in/andrey-r-97491084/"

      [[languages.ru.params.socialIcons]]
        name = "email"
        url = "mailto:ryabinin.andrei@gmail.com"

    [[languages.ru.menus.main]]
      name = "Обо мне"
      url = "/about/"
      weight = 10

    [[languages.ru.menus.main]]
      name = "Работа"
      url = "/projects/"
      weight = 20

  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 2
    title = "Andrey Ryabinin — Portfolio"
    contentDir = "content/en"

    [languages.en.params]
      title = "Andrey Ryabinin"
      description = "System administrator portfolio — projects, skills, contact"
      keywords = ["portfolio", "developer", "projects"]
      author = "Andrey Ryabinin"
      mainSections = ["projects"]

      [languages.en.params.homeInfoParams]
        Title = "Hi, I'm Andrey 👋"
        Content = """
System administrator. I maintain IT infrastructure, keep servers, networks, and services running reliably.
Below is a bit about me and a few case studies worth checking out.
"""

      [[languages.en.params.socialIcons]]
        name = "github"
        url = "https://github.com/xrumdik"

      [[languages.en.params.socialIcons]]
        name = "linkedin"
        url = "https://www.linkedin.com/in/andrey-r-97491084/"

      [[languages.en.params.socialIcons]]
        name = "email"
        url = "mailto:ryabinin.andrei@gmail.com"

    [[languages.en.menus.main]]
      name = "About"
      url = "/en/about/"
      weight = 10

    [[languages.en.menus.main]]
      name = "Work"
      url = "/en/projects/"
      weight = 20
