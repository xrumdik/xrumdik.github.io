# Вторая версия сайта на теме Nerdy. Собирается отдельно от основной (PaperMod).
# Языки собираются двумя запусками: hugo.ru.yaml -> /nerdy/, hugo.en.yaml -> /en/nerdy/
theme: nerdy
disableKinds:
  - taxonomy
  - term
enableRobotsTXT: false
markup:
  tableOfContents:
    startLevel: 2
    endLevel: 3
  goldmark:
    renderer:
      unsafe: true
build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: css
    - source: '(postcss|tailwind)\.config\.(js|mjs|ts)'
      target: css
