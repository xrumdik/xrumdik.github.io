name: Trivy Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  filesystem-scan:
    name: Scan repository (deps, secrets, configs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Run Trivy filesystem scan (SARIF for Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          format: "sarif"
          output: "trivy-fs-results.sarif"
          exit-code: "0"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: always()
        with:
          sarif_file: "trivy-fs-results.sarif"
          category: "trivy-filesystem"

  docker-scan:
    name: Build & scan Docker image (if Dockerfile exists)
    runs-on: ubuntu-latest
    needs: filesystem-scan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if Dockerfile exists
        id: check
        run: |
          if [ -f "Dockerfile" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Dockerfile не найден в репозитории — пропускаю сканирование образа."
          fi

      - name: Build Docker image
        if: steps.check.outputs.found == 'true'
        run: docker build -t local-scan-target:latest .

      - name: Run Trivy image scan
        if: steps.check.outputs.found == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "image"
          image-ref: "local-scan-target:latest"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Run Trivy image scan (SARIF for Security tab)
        if: steps.check.outputs.found == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "image"
          image-ref: "local-scan-target:latest"
          format: "sarif"
          output: "trivy-image-results.sarif"
          exit-code: "0"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload image SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: steps.check.outputs.found == 'true'
        with:
          sarif_file: "trivy-image-results.sarif"
          category: "trivy-image"
