name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Тема Nerdy требует Hugo 0.162.1+, поэтому обе версии сайта собираются одним Hugo
      HUGO_VERSION: 0.162.1
    steps:
      - name: Install Hugo CLI
        run: |
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -o /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # 1. Основная версия сайта (PaperMod) -> public/
      - name: Build with Hugo (PaperMod)
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --minify

      # 2. Вторая версия (Nerdy): RU -> public/nerdy/, EN -> public/en/nerdy/
      - name: Install Nerdy dependencies
        working-directory: nerdy
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build with Hugo (Nerdy)
        working-directory: nerdy
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          for lang in ru en; do
            dest="${GITHUB_WORKSPACE}/public/nerdy"
            [ "$lang" = "en" ] && dest="${GITHUB_WORKSPACE}/public/en/nerdy"
            # первый проход создаёт hugo_stats.json, по нему Tailwind собирает CSS
            hugo --config "hugo.yaml,hugo.${lang}.yaml" --renderToMemory
            hugo --config "hugo.yaml,hugo.${lang}.yaml" --minify --gc --destination "$dest"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
