{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default (.Get "caption") | default "" -}}
<figure class="rest-photo">
  <a href="{{ $src }}" target="_blank" rel="noopener">
    <img src="{{ $src }}" alt="{{ $alt }}" loading="lazy" decoding="async">
  </a>
  {{- with .Get "caption" }}
  <figcaption>{{ . }}</figcaption>
  {{- end }}
</figure>
